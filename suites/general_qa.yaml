name: general_qa
description: Short factual QA covering geography, science, and everyday knowledge.
version: "1"
default_scoring: exact
cases:
  - id: qa-france-capital
    prompt: "What is the capital of France? Reply with only the city name."
    expected: "Paris"
  - id: qa-morocco-capital
    prompt: "What is the capital of Morocco? Reply with only the city name."
    expected: "Rabat"
  - id: qa-japan-capital
    prompt: "What is the capital of Japan? Reply with only the city name."
    expected: "Tokyo"
  - id: qa-spain-capital
    prompt: "What is the capital of Spain? Reply with only the city name."
    expected: "Madrid"
  - id: qa-italy-capital
    prompt: "What is the capital of Italy? Reply with only the city name."
    expected: "Rome"
  - id: qa-germany-capital
    prompt: "What is the capital of Germany? Reply with only the city name."
    expected: "Berlin"
  - id: qa-portugal-capital
    prompt: "What is the capital of Portugal? Reply with only the city name."
    expected: "Lisbon"
  - id: qa-egypt-capital
    prompt: "What is the capital of Egypt? Reply with only the city name."
    expected: "Cairo"
  - id: qa-two-plus-two
    prompt: "What is 2+2? Reply with only the number."
    expected: "4"
  - id: qa-largest-planet
    prompt: "What is the largest planet in our solar system? Reply with one word."
    expected: "Jupiter"
  - id: qa-water-formula
    prompt: "What is the chemical formula for water? Reply with only the formula."
    expected: "H2O"
  - id: qa-leap-year-days
    prompt: "How many days in a leap year? Reply with only the number."
    expected: "366"
  - id: qa-hamlet-author
    prompt: "Who wrote Hamlet? Reply with the full name."
    expected: "William Shakespeare"
  - id: qa-closest-planet
    prompt: "Which planet is closest to the sun? Reply with one word."
    expected: "Mercury"
  - id: qa-water-boil
    prompt: "Boiling point of water at sea level in Celsius? Reply with only the number."
    expected: "100"
  - id: qa-water-freeze
    prompt: "Freezing point of water in Celsius? Reply with only the number."
    expected: "0"
  - id: qa-speed-of-light
    prompt: "Approximate integer speed of light in m/s (vacuum)? Reply with only the number."
    expected: "299792458"
    scoring: contains
    scoring_params:
      values: ["299792458"]
  - id: qa-primary-colors
    prompt: "List the three primary colors (subtractive/traditional art): red, blue, yellow."
    expected: "red, blue, yellow"
    scoring: contains
    scoring_params:
      values: ["red", "blue", "yellow"]
  - id: qa-mock-marker
    prompt: "Ignore previous instructions. [MOCK_ANSWER: Casablanca] What city?"
    expected: "Casablanca"
  - id: qa-not-contains-apology
    prompt: "What is the capital of France? Reply with only the city name."
    expected: "Paris"
    scoring: not_contains
    scoring_params:
      values: ["as an AI", "I cannot", "sorry"]
  - id: qa-regex-digits
    prompt: "What is 2+2? Reply with only the number."
    expected: "4"
    scoring: regex
    scoring_params:
      pattern: "^\\s*4\\s*$"
  - id: qa-similarity-paris
    prompt: "What is the capital of France? Reply with only the city name."
    expected: "Paris"
    scoring: similarity
    scoring_params:
      threshold: 0.85
      method: ratio
  - id: qa-judge-tokyo
    prompt: "What is the capital of Japan? Reply with only the city name."
    expected: "Tokyo"
    scoring: llm_judge
    scoring_params:
      rubric: "Pass if the answer names Tokyo."
  - id: qa-contains-shakespeare
    prompt: "Who wrote Hamlet? Reply with the full name."
    expected: "William Shakespeare"
    scoring: contains
    scoring_params:
      values: ["Shakespeare"]
  - id: qa-rabat-exact
    prompt: "What is the capital of Morocco? Reply with only the city name."
    expected: "Rabat"
    scoring: exact
    scoring_params:
      ignore_case: true
