[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Tiny honest framework to compare LLM models on your own prompt suites"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "Mohamed-Taqy Salmi", email = "mohamedtaqysalmi@users.noreply.github.com" },
]
keywords = ["llm", "evaluation", "benchmark", "openai", "ollama", "typer"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "pyyaml>=6.0",
  "rich>=13.7.0",
  "jsonschema>=4.22.0",
  "rapidfuzz>=3.9.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[project.scripts]
llm-eval = "llm_eval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/suites",
  "/config",
  "/LICENSE",
  "/README.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
